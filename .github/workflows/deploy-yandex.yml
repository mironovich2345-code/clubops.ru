# Build the CLUB-OPS production image and push it to Yandex Container Registry.
# The VM's systemd timer pulls the :main tag and deploys it (see deploy/deploy.sh)
# — this workflow only builds + publishes; it never touches the server.
name: deploy-yandex

on:
  push:
    branches: [main]
  workflow_dispatch:

# One build per branch; do not cancel an in-progress publish.
concurrency:
  group: deploy-yandex-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Required checks (deterministic)
        run: |
          npm run pilot:deploy-config
          npm run pilot:health

      - name: Build metadata
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Yandex Container Registry
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: printf '%s' "$YC_SA_KEY_JSON" | docker login --username json_key --password-stdin cr.yandex

      # Build ONCE (single-platform) and LOAD into the local docker daemon so the
      # exact image that will be published can be scanned/verified before push.
      # `pull: true` always refreshes the base image; APT_REFRESH busts the apt
      # security-upgrade layer so it is never served from stale cache.
      - name: Build image (load for verification)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          pull: true
          platforms: linux/amd64
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
            APT_REFRESH=${{ github.sha }}
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/club-ops:${{ github.sha }}
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/club-ops:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify OS package versions in the REAL built image (fails on old
      # libgnutls30 / wrong arch). The check script is bind-mounted, not baked in.
      - name: Verify image OS package versions
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/scripts/check-runtime-packages.sh:/tmp/check-runtime-packages.sh:ro" \
            --entrypoint sh \
            "cr.yandex/${{ secrets.YC_REGISTRY_ID }}/club-ops:${{ github.sha }}" \
            /tmp/check-runtime-packages.sh

      # Publish only AFTER verification. Same image (already logged in above).
      - name: Push image (after verification)
        run: |
          docker push "cr.yandex/${{ secrets.YC_REGISTRY_ID }}/club-ops:${{ github.sha }}"
          docker push "cr.yandex/${{ secrets.YC_REGISTRY_ID }}/club-ops:main"
