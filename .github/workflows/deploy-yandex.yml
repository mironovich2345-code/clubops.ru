# Build the CLUB-OPS production image and push it to Yandex Container Registry.
# The VM's systemd timer pulls the :main tag and deploys it (see deploy/deploy.sh)
# — this workflow only builds + publishes; it never touches the server.
name: deploy-yandex

on:
  push:
    branches: [main]
  workflow_dispatch:

# One build per branch; do not cancel an in-progress publish.
concurrency:
  group: deploy-yandex-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Required checks (deterministic)
        run: |
          npm run pilot:deploy-config
          npm run pilot:health

      - name: Build metadata
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Yandex Container Registry
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: printf '%s' "$YC_SA_KEY_JSON" | docker login --username json_key --password-stdin cr.yandex

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/club-ops:${{ github.sha }}
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/club-ops:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
