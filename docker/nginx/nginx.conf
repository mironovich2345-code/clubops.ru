# Optional reverse proxy for the CLUB-OPS app container.
# Enable with: docker compose -f docker-compose.production.yml --profile nginx up -d
#
# Provides one place for TLS termination and request limits. The app itself
# already serves files through scoped routes, so nginx only proxies.

upstream club_ops_app {
    server app:3000;
}

# --- HTTP -------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Allow document uploads up to ~12 MB (app limit is 10 MB per file).
    client_max_body_size 12m;

    # Uncomment to force HTTPS once certificates are configured below.
    # return 301 https://$host$request_uri;

    location /api/health {
        proxy_pass http://club_ops_app;
        access_log off;
    }

    location / {
        proxy_pass http://club_ops_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}

